<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="theme-color"
        content="#06B6D4">

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">

    <title>LocalizaCEP</title>
</head>

<body>

    <main>

        <section>

            <h2>
                Consulta de <span>Endereço</span>
            </h2>

            <p>
                Consulte um endereço brasileiro informando
                o CEP e a cidade.
            </p>

            <form id="formConsulta">

                <label for="cep">
                    CEP
                </label>

                <input
                    id="cep"
                    type="text"
                    inputmode="numeric"
                    maxlength="9"
                    placeholder="01001-000"
                    autocomplete="postal-code"
                    required
                >

                <label for="cidade">
                    Cidade
                </label>

                <input
                    id="cidade"
                    type="text"
                    placeholder="São Paulo"
                    autocomplete="address-level2"
                    required
                >

                <button type="submit">
                    Consultar Endereço
                </button>

            </form>

            <p
                id="mensagem"
                role="status"
                aria-live="polite">
            </p>

            <!-- BOTÃO DE INSTALAÇÃO -->
            <button
                id="btnInstalar"
                type="button">
                Instalar APK
            </button>

        </section>

    </main>


    <script src="index.js"></script>


    <script>

        if ("serviceWorker" in navigator) {

            window.addEventListener("load", () => {

                navigator.serviceWorker
                    .register("./sw.js")
                    .then(() => {

                        console.log(
                            "Service Worker registrado."
                        );

                    })
                    .catch((erro) => {

                        console.error(
                            "Erro ao registrar Service Worker:",
                            erro
                        );

                    });

            });

        }

    </script>

</body>

</html>
