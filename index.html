<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#06B6D4">

    <link rel="stylesheet"
          href="style.css">

    <link rel="manifest"
          href="manifest.json">

    <title>LocalizaCEP</title>
</head>

<body>

    <!-- =====================================
         BOTÃO DE INSTALAÇÃO
    ====================================== -->

    <button id="btnInstalar" type="button">
        Instalar APK
    </button>


    <!-- =====================================
         FORMULÁRIO DE CONSULTA
    ====================================== -->

    <form id="formConsulta">

        <label for="cep">
            CEP
        </label>

        <input
            id="cep"
            type="text"
            inputmode="numeric"
            maxlength="9"
            placeholder="01001-000"
            autocomplete="postal-code"
            required
        >


        <label for="cidade">
            Cidade
        </label>

        <input
            id="cidade"
            type="text"
            placeholder="São Paulo"
            autocomplete="address-level2"
            required
        >


        <button type="submit">
            Consultar Endereço
        </button>

    </form>


    <!-- =====================================
         MENSAGEM DE STATUS / ERRO
    ====================================== -->

    <p
        id="mensagem"
        role="status"
        aria-live="polite">
    </p>


    <!-- =====================================
         JAVASCRIPT PRINCIPAL
    ====================================== -->

    <script src="index.js"></script>


    <!-- =====================================
         SERVICE WORKER
    ====================================== -->

    <script>

        if ("serviceWorker" in navigator) {

            window.addEventListener("load", () => {

                navigator.serviceWorker
                    .register("./sw.js")

                    .then(() => {

                        console.log(
                            "Service Worker registrado com sucesso!"
                        );

                    })

                    .catch((erro) => {

                        console.error(
                            "Erro ao registrar Service Worker:",
                            erro
                        );

                    });

            });

        }

    </script>

</body>

</html>
