<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>LocalizaCEP</title>
</head>

<body>

    <main>

        <section>

            <h2>
                Consulta de <span>Endereço</span>
            </h2>

            <p>
                Consulte um endereço brasileiro informando
                o CEP e a cidade.
            </p>

            <form id="formConsulta">

                <label for="cep">
                    CEP
                </label>

                <input
                    id="cep"
                    type="text"
                    inputmode="numeric"
                    maxlength="9"
                    placeholder="01001-000"
                    autocomplete="postal-code"
                    required
                >

                <label for="cidade">
                    Cidade
                </label>

                <input
                    id="cidade"
                    type="text"
                    placeholder="São Paulo"
                    autocomplete="address-level2"
                    required
                >

                <button type="submit">
                    Consultar Endereço
                </button>

            </form>

            <p
                id="mensagem"
                role="status"
                aria-live="polite">
            </p>

        </section>

    </main>

    <script src="index.js"></script>

</body>

</html>
